services:
  legacy-db:
    build: ./legacy_db
    image: payer-legacy-db:16-wal2json
    container_name: payer-legacy-db
    # Logical decoding is required for log-based change data capture;
    # wal2json must also be allowlisted as an output plugin.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - output_plugin_libraries=pgoutput,test_decoding,wal2json
      # Cap the WAL a replication slot can hold. Past it, Postgres invalidates
      # the slot (the CDC loader then takes a new snapshot) instead of filling
      # the disk; `make slot-check` alerts at half of it.
      - -c
      - max_slot_wal_keep_size=1GB
    environment:
      POSTGRES_DB: payer_legacy
      POSTGRES_USER: legacy
      POSTGRES_PASSWORD: legacy
    ports:
      - "5433:5432"
    volumes:
      - ./legacy_db/init:/docker-entrypoint-initdb.d:ro
      - legacy_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacy -d payer_legacy"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Lakehouse catalog: DuckLake keeps its metadata (schemas, tables, snapshots,
  # the list of Parquet files) in this Postgres database; the data itself is
  # Parquet under data/lakehouse/. Separate from the legacy source on purpose.
  lakehouse-catalog:
    image: postgres:16
    container_name: payer-lakehouse-catalog
    environment:
      POSTGRES_DB: lakehouse
      POSTGRES_USER: lakehouse
      POSTGRES_PASSWORD: lakehouse
    ports:
      - "5434:5432"
    volumes:
      - lakehouse_catalog:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakehouse -d lakehouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FHIR API (make fhir-up): a HAPI FHIR R4 server that fhir/publish.py loads from
  # the gold FHIR models. Its database (H2) lives in the container, so recreating
  # the container (make fhir-up does) starts from an empty server. No request
  # validation: the resources are validated before they are published.
  fhir-server:
    profiles: [api]
    image: hapiproject/hapi:v8.12.0-2
    container_name: payer-fhir-server
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.bulk_export_enabled: "true"
    ports:
      - "8090:8080"

  # Orchestration (optional): docker compose --profile airflow up -d
  airflow-db:
    profiles: [airflow]
    image: postgres:16
    container_name: payer-airflow-db
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow:
    profiles: [airflow]
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: payer-airflow:3.3.2
    container_name: payer-airflow
    # Run as the host user so files written to ./data and ./dbt keep their owner.
    user: "${AIRFLOW_UID:-1000}:0"
    depends_on:
      airflow-db: {condition: service_healthy}
      legacy-db: {condition: service_healthy}
      lakehouse-catalog: {condition: service_healthy}
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # Local development only: every user is an admin, no login screen.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      LEGACY_PG_DSN: host=legacy-db port=5432 dbname=payer_legacy user=legacy password=legacy
      LAKEHOUSE_CATALOG: host=lakehouse-catalog port=5432 dbname=lakehouse user=lakehouse password=lakehouse
    volumes:
      - .:/opt/project
    ports:
      - "8080:8080"
    command:
      - bash
      - -c
      - >-
        airflow db migrate
        && airflow pools set lakehouse 1 "dbt builds, one at a time"
        && exec airflow standalone

volumes:
  legacy_data:
  lakehouse_catalog:
  airflow_data:

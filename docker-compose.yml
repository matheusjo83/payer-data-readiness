services:
  legacy-db:
    build: ./legacy_db
    image: payer-legacy-db:16-wal2json
    container_name: payer-legacy-db
    # Logical decoding is required for log-based change data capture;
    # wal2json must also be allowlisted as an output plugin.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - output_plugin_libraries=pgoutput,test_decoding,wal2json
      # Cap the WAL a replication slot can hold. Past it, Postgres invalidates
      # the slot (the CDC loader then takes a new snapshot) instead of filling
      # the disk; `make slot-check` alerts at half of it.
      - -c
      - max_slot_wal_keep_size=1GB
    environment:
      POSTGRES_DB: payer_legacy
      POSTGRES_USER: legacy
      POSTGRES_PASSWORD: legacy
    ports:
      - "5433:5432"
    volumes:
      - ./legacy_db/init:/docker-entrypoint-initdb.d:ro
      - legacy_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacy -d payer_legacy"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Lakehouse catalog: DuckLake keeps its metadata (schemas, tables, snapshots,
  # the list of Parquet files) in this Postgres database; the data itself is
  # Parquet under data/lakehouse/. Separate from the legacy source on purpose.
  lakehouse-catalog:
    image: postgres:16
    container_name: payer-lakehouse-catalog
    environment:
      POSTGRES_DB: lakehouse
      POSTGRES_USER: lakehouse
      POSTGRES_PASSWORD: lakehouse
    ports:
      - "5434:5432"
    volumes:
      - lakehouse_catalog:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakehouse -d lakehouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FHIR API (make fhir-up): a HAPI FHIR R4 server that fhir/publish.py loads from
  # the gold FHIR models. Its database (H2) lives in the container, so recreating
  # the container (make fhir-up does) starts from an empty server. No request
  # validation: the resources are validated before they are published. No port
  # on the host: clients reach it through fhir-gateway-patient, which checks
  # their SMART access tokens.
  fhir-server:
    profiles: [api]
    image: hapiproject/hapi:v8.12.0-2
    container_name: payer-fhir-server
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.bulk_export_enabled: "true"

  # Provider Access and Payer-to-Payer APIs (CMS-0057-F): a second HAPI server with
  # the data those APIs share, without financial data (the CARIN Basis claims,
  # under the same IDs as the full ones on fhir-server), the attribution lists
  # and the opt-outs. No port on the host: clients reach it through fhir-gateway.
  fhir-server-provider:
    profiles: [api]
    image: hapiproject/hapi:v8.12.0-2
    container_name: payer-fhir-server-provider
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.bulk_export_enabled: "true"

  # SMART authorization server (fhir/auth/server.py): the member login and
  # authorization code flow of the Patient Access API, and the client
  # credentials with signed JWTs (Backend Services) of the Provider Access and
  # Payer-to-Payer APIs. Clients registered by make fhir-clients.
  fhir-auth:
    profiles: [api]
    build: ./fhir/gateway
    image: payer-fhir-python:local
    container_name: payer-fhir-auth
    environment:
      AUTH_CLIENTS: /opt/auth-data/clients.json
      AUTH_PUBLIC_URL: http://localhost:8093
      PATIENT_ACCESS_URL: http://localhost:8090/fhir
      PROVIDER_ACCESS_URL: http://localhost:8092/fhir
      PATIENT_FHIR_UPSTREAM: http://fhir-server:8080/fhir
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./fhir/auth:/opt/auth:ro
      - ./data/fhir_auth:/opt/auth-data:ro
    command: ["python", "-I", "/opt/auth/server.py", "--port", "8080"]
    ports:
      - "8093:8080"

  # The Patient Access API: SMART App Launch, each app limited to the member who
  # authorized it (fhir/gateway/gateway.py --api patient-access), in front of
  # fhir-server.
  fhir-gateway-patient:
    profiles: [api]
    build: ./fhir/gateway
    image: payer-fhir-python:local
    container_name: payer-fhir-gateway-patient
    depends_on: [fhir-server, fhir-auth]
    environment:
      GATEWAY_API: patient-access
      UPSTREAM_FHIR_URL: http://fhir-server:8080/fhir
      PUBLIC_BASE_URL: http://localhost:8090/fhir
      AUTH_INTERNAL_URL: http://fhir-auth:8080
      AUTH_PUBLIC_URL: http://localhost:8093
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./fhir/gateway:/opt/gateway:ro
    command: ["python", "-I", "/opt/gateway/gateway.py", "--port", "8080"]
    ports:
      - "8090:8080"

  # The Provider Access and Payer-to-Payer APIs: SMART Backend Services and the
  # Da Vinci PDex operations HAPI does not implement ($davinci-data-export,
  # $bulk-member-match, $member-match), in front of fhir-server-provider.
  fhir-gateway:
    profiles: [api]
    build: ./fhir/gateway
    image: payer-fhir-python:local
    container_name: payer-fhir-gateway
    depends_on: [fhir-server-provider, fhir-auth, legacy-db]
    environment:
      GATEWAY_API: provider-access
      UPSTREAM_FHIR_URL: http://fhir-server-provider:8080/fhir
      PUBLIC_BASE_URL: http://localhost:8092/fhir
      AUTH_INTERNAL_URL: http://fhir-auth:8080
      AUTH_PUBLIC_URL: http://localhost:8093
      # Prior authorization (Da Vinci PAS) writes requests to the payer's UM system.
      LEGACY_PG_DSN: host=legacy-db port=5432 dbname=payer_legacy user=legacy password=legacy
      PYTHONUNBUFFERED: "1"
    # Subscription notifications go to the providers' endpoints; the checks listen on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./fhir/gateway:/opt/gateway:ro
    command: ["python", "-I", "/opt/gateway/gateway.py", "--port", "8080"]
    ports:
      - "8092:8080"

  # Orchestration (optional): docker compose --profile airflow up -d
  airflow-db:
    profiles: [airflow]
    image: postgres:16
    container_name: payer-airflow-db
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow:
    profiles: [airflow]
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: payer-airflow:3.3.2
    container_name: payer-airflow
    # Run as the host user so files written to ./data and ./dbt keep their owner.
    user: "${AIRFLOW_UID:-1000}:0"
    depends_on:
      airflow-db: {condition: service_healthy}
      legacy-db: {condition: service_healthy}
      lakehouse-catalog: {condition: service_healthy}
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # Local development only: every user is an admin, no login screen.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      LEGACY_PG_DSN: host=legacy-db port=5432 dbname=payer_legacy user=legacy password=legacy
      LAKEHOUSE_CATALOG: host=lakehouse-catalog port=5432 dbname=lakehouse user=lakehouse password=lakehouse
    volumes:
      - .:/opt/project
    ports:
      - "8080:8080"
    command:
      - bash
      - -c
      - >-
        airflow db migrate
        && airflow pools set lakehouse 1 "dbt builds, one at a time"
        && exec airflow standalone

volumes:
  legacy_data:
  lakehouse_catalog:
  airflow_data:

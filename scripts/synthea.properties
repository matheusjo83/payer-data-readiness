# Synthea configuration overrides for this project
exporter.baseDirectory = ./data/synthea/
exporter.fhir.export = true
exporter.fhir.bulk_data = true
exporter.ccda.export = false
exporter.csv.export = false
# Organizations, locations, practitioners and their roles, which the patient
# resources reference. With transaction bundles (the default) and without these
# files, Synthea warns that the references point to resources it did not export.
exporter.hospital.fhir.export = true
exporter.practitioner.fhir.export = true

# Runs the Quickstart end to end on synthetic data and fails if any gate fails:
# the replication slot drill (monitoring alerts and recovery), dbt build (models
# and data tests), the SQL on FHIR v2 test suite (shareable tests) and the HL7
# FHIR validator on a sample of the legacy-derived resources against the CARIN
# Blue Button 2.1.0 profiles and on the prior authorizations against Da Vinci PDex
# 2.1.0, with codes checked by tx.fhir.org. dbt checks every code against the CMS
# and FDA releases (gold.terminology_code_check). Then the gold resources are
# published to a HAPI FHIR server and checked through its API (searches, Bulk
# $export), and the data of the Provider Access and Payer-to-Payer APIs (claims
# without financial data, attribution lists, opt-outs) to a second one, checked
# through the gateway that implements the Da Vinci PDex operations. Last, legacy
# changes are streamed and applied incrementally, and the
# current state is checked against a full rebuild and against Postgres. The
# lakehouse is DuckLake: a catalog in Postgres (lakehouse-catalog), Parquet data.
# The four validator samples run in one validator call, after the API checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    # Pinned, like the generators: ubuntu-latest moves to a new release on its own.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The checkout's `git init` and pip print hints about their defaults otherwise.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Synthea and the HL7 validator are pinned in these scripts; the cache key
      # changes when either version does.
      - name: Cache tool jars
        uses: actions/cache@v6
        with:
          path: tools/*.jar
          key: tools-${{ hashFiles('scripts/generate_synthea.sh', 'fhir/validate.py') }}

      - name: Cache FHIR packages
        uses: actions/cache@v6
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('fhir/validate.py') }}

      # Code system releases (CMS ICD-10-CM, pinned by SHA-256; FDA NDC Directory, the
      # current one). Keyed by the week, so the NDC Directory is at most a week old.
      - name: Week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache code system releases
        uses: actions/cache@v6
        with:
          path: |
            data/terminology/*.zip
            data/terminology/*.modified
          key: terminology-${{ hashFiles('ingestion/load_terminology.py') }}-${{ steps.week.outputs.week }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Start legacy database and lakehouse catalog
        run: make up

      # Started early: the servers take a while to boot, and publishing waits for them.
      - name: Start FHIR servers
        run: make fhir-up

      - name: Generate legacy data
        run: make seed

      - name: Generate PBM feed
        run: make pbm

      - name: Generate Synthea data
        run: make synthea

      - name: Ingest into bronze
        run: make ingest

      # Pushes the CDC slot past its WAL cap and checks the alert, the loss and the
      # recovery (a new snapshot of the same data). Before dbt, so gold.cdc_slot_lag
      # records the loss and its warning test fires.
      - name: Replication slot drill
        run: make slot-drill

      # cdc-check runs dbt again on a selection, which overwrites run_results.json:
      # the full build's results are kept apart for the reports.
      - name: dbt build
        run: |
          make dbt
          cp dbt/target/run_results.json data/dbt_run_results.json

      - name: SQL on FHIR conformance
        run: make conformance

      - name: Publish to the FHIR servers
        run: make fhir-publish

      - name: FHIR API checks (searches, Bulk $export)
        run: make fhir-api-check

      - name: Provider Access and Payer-to-Payer API checks (PDex operations)
        run: make fhir-provider-api-check

      # One HL7 validator run for the four samples (CARIN Blue Button, PDex prior
      # authorizations, Provider Access data, Payer-to-Payer messages): loading the
      # packages takes minutes, validating them seconds. After the API checks,
      # which write the Payer-to-Payer messages; one summary per sample.
      - name: FHIR validation (CARIN Blue Button 2.1.0 and Da Vinci PDex 2.1.0, tx.fhir.org)
        run: make fhir-validate-all

      # Last, so the steps above use the data as generated: simulated legacy
      # changes, a CDC sync, the incremental dbt run, parity with a full rebuild
      # and a row-by-row reconciliation with Postgres.
      - name: Incremental CDC current state
        run: make cdc-check

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            data/sof_conformance.json
            data/slot_drill.json
            data/fhir_validation_carin-bb/summary.json
            data/fhir_validation_carin-bb/validator.log
            data/fhir_validation_pdex/summary.json
            data/fhir_validation_pdex/validator.log
            data/fhir_validation_provider-access/summary.json
            data/fhir_validation_provider-access/validator.log
            data/fhir_validation_payer-to-payer/summary.json
            data/fhir_validation_payer-to-payer/validator.log
            data/fhir_publish.json
            data/fhir_publish_provider.json
            data/fhir_api.json
            data/fhir_provider_api.json
            data/fhir_provider_api/messages/
            data/cdc_reconcile.json
            data/dbt_run_results.json
            dbt/target/run_results.json

      - name: Stop containers
        if: always()
        run: docker compose --profile api down -v

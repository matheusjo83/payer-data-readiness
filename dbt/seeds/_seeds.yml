version: 2

seeds:
  - name: first_name_nicknames
    description: >
      Common English and Spanish nicknames with the formal first name they stand for, used to
      compare first names in identity resolution. It covers the nicknames the synthetic PBM
      generator uses (and a few more), so its benefit on this data is an upper bound.
    columns:
      - name: nickname
        description: Nickname, lower case.
        data_tests: [unique, not_null]
      - name: first_name
        description: Formal first name, lower case.
        data_tests: [not_null]

  - name: identity_review_decisions
    description: >
      Decisions of the people who work the identity review queue (gold.identity_review_queue),
      one row per decided case. It is the audit trail of the review: who decided what and when,
      under version control. gold.member_xref and gold.pbm_duplicate_pairs apply the decisions
      over the model; gold.identity_review_audit shows which still apply. In this project the
      reviewer is simulated from the ground truth (`make review`).
    config:
      column_types:
        review_type: varchar
        cardholder_id: varchar
        candidate_id: varchar
        decision: varchar
        reviewer: varchar
        decided_at: date
        note: varchar
    data_tests:
      - unique_combination:
          arguments:
            columns: [review_type, cardholder_id, candidate_id]
    columns:
      - name: review_type
        description: member_link (a cardholder and a legacy member) or pbm_duplicate (two cardholders).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [member_link, pbm_duplicate]
      - name: cardholder_id
        description: The PBM cardholder of the case (for pbm_duplicate, the lower of the two IDs).
        data_tests: [not_null]
      - name: candidate_id
        description: The legacy member ID (member_link) or the other cardholder ID (pbm_duplicate).
        data_tests: [not_null]
      - name: decision
        description: match (the same person) or no_match.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [match, no_match]
      - name: reviewer
        description: Who decided.
        data_tests: [not_null]
      - name: decided_at
        description: Date of the decision.
        data_tests: [not_null]
      - name: note
        description: The reviewer's note, if any.

version: 2

models:
  - name: fct_claims
    description: Claims with aggregated lines and integrity flags (gold).
    columns:
      - name: claim_id
        data_tests: [unique, not_null]
  - name: fct_prior_auth_timeliness
    description: Prior authorization decision time vs. CMS-0057-F timeframes.
    columns:
      - name: prior_auth_id
        data_tests: [unique, not_null]
  - name: dq_issue_summary
    description: Data-quality scorecard of known legacy issues detected by the pipeline.
  - name: load_reliability
    description: Load success rate, volume and duration per source.
  - name: cdc_latency
    description: >
      Source-to-lakehouse latency of CDC changes per legacy table
      (commit in Postgres to arrival in bronze), with change volume by operation.
    columns:
      - name: source_table
        data_tests: [unique, not_null]

version: 2

models:
  - name: fct_claims
    description: >
      Claims with aggregated lines and integrity flags (gold). One row per claim header;
      header columns are documented in stg_legacy__claims.
    columns:
      - name: claim_id
        description: "{{ doc('claim_id') }}"
        data_tests: [unique, not_null]
      - name: member_id
        description: "{{ doc('member_id') }}"
      - name: provider_id
        description: "{{ doc('provider_id') }}"
      - name: claim_type
        description: professional, institutional or pharmacy.
      - name: service_from_date
        description: First date of service.
      - name: service_to_date
        description: Last date of service.
      - name: received_date
        description: Date the payer received the claim.
      - name: adjudicated_date
        description: Date the claim was adjudicated. Null while pending.
      - name: claim_status
        description: paid, denied, pending or void.
      - name: total_charged
        description: Total billed amount (header).
      - name: total_paid
        description: Total paid amount (header).
      - name: network_status
        description: in_network or out_of_network.
      - name: type_of_bill
        description: Institutional claims only. NUBC type of bill.
      - name: institutional_setting
        description: inpatient or outpatient (institutional claims only), from the type of bill.
      - name: place_of_service_code
        description: Professional claims only. CMS place of service code.
      - name: days_supply
        description: Pharmacy claims only. Days supply dispensed.
      - name: dispense_as_written_code
        description: Pharmacy claims only. NCPDP dispense as written (DAW) code.
      - name: refill_number
        description: Pharmacy claims only. Refill number (0 = original fill).
      - name: refills_authorized
        description: Pharmacy claims only. Number of refills authorized.
      - name: updated_at
        description: "{{ doc('updated_at') }}"
      - name: line_count
        description: Number of claim lines (0 when the claim has no lines).
      - name: lines_charged
        description: Sum of line charged amounts.
      - name: lines_paid
        description: Sum of line paid amounts.
      - name: has_known_member
        description: True when member_id exists in the member master.
      - name: plan_id
        description: Plan of the coverage span in effect on the service date. Null when there is none.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_plan')
                field: plan_id
      - name: eligibility_id
        description: Coverage span in effect on the service date. Null when there is none.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_legacy__eligibility')
                field: eligibility_id
      - name: is_within_eligibility
        description: >
          True when the service date falls inside one of the member's coverage spans.
          Null for claims whose member is unknown.
        data_tests:
          - accepted_values:
              arguments:
                values: [true]
              config: {severity: warn}   # claims outside coverage exist in the legacy source
      - name: paid_exceeds_charged
        description: True when the header paid amount is greater than the charged amount.
      - name: days_to_adjudicate
        description: Days from receipt to adjudication.

  - name: fct_prior_auth_timeliness
    description: Prior authorization decision time vs. CMS-0057-F timeframes.
    columns:
      - name: prior_auth_id
        description: "{{ doc('prior_auth_id') }}"
        data_tests: [unique, not_null]
      - name: member_id
        description: "{{ doc('member_id') }}"
      - name: is_expedited
        description: True for expedited requests (72-hour timeframe), false for standard (7 days).
      - name: requested_at
        description: Time the request was received.
      - name: decided_at
        description: Time of the decision. Null while pending.
      - name: decision
        description: approved, denied or pending.
      - name: timeframe_hours
        description: Applicable CMS-0057-F timeframe in hours (72 or 168).
      - name: decision_hours
        description: Elapsed hours from request to decision. Null while pending.
      - name: within_timeframe
        description: True when decided within the timeframe. Null while pending.

  - name: fct_member_months
    description: >
      One row per member and calendar month of coverage, up to the month of the reference date (var as_of_date).
      Standard denominator for utilization and cost metrics (e.g. claims per 1,000 member months).
    data_tests:
      - unique_combination:
          arguments:
            columns: ['member_id', 'coverage_month']
    columns:
      - name: member_id
        description: "{{ doc('member_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_member')
                field: member_id
      - name: plan_id
        description: "{{ doc('plan_id') }}"
        data_tests: [not_null]
      - name: line_of_business
        description: "{{ doc('line_of_business') }}"
      - name: coverage_month
        description: First day of the covered calendar month.
        data_tests: [not_null]

  - name: fct_pbm_claims
    description: >
      PBM pharmacy claims with the member resolved through gold.member_xref and the coverage span
      on the fill date. Only claims with a linked member and coverage are exported to FHIR.
    columns:
      - name: rx_claim_id
        description: PBM claim ID.
        data_tests: [unique, not_null]
      - name: cardholder_id
        description: "{{ doc('cardholder_id') }}"
      - name: fill_date
        description: Date the prescription was filled.
      - name: ndc_code
        description: National Drug Code (11-digit form).
      - name: quantity
        description: Quantity dispensed.
      - name: days_supply
        description: Days supply dispensed.
      - name: dispense_as_written_code
        description: NCPDP dispense as written (DAW) code.
      - name: refill_number
        description: Refill number (0 = original fill).
      - name: refills_authorized
        description: Number of refills authorized.
      - name: pharmacy_id
        description: Dispensing pharmacy.
      - name: network_status
        description: in_network or out_of_network.
      - name: ingredient_cost
        description: Submitted ingredient cost.
      - name: patient_pay
        description: Amount paid by the patient.
      - name: plan_paid
        description: Amount paid by the plan.
      - name: claim_status
        description: paid or reversed.
      - name: processed_at
        description: When the PBM processed the claim.
      - name: member_id
        description: Member linked to the cardholder (null unless linked).
      - name: identity_status
        description: Status of the cardholder in gold.member_xref (linked, review, unmatched).
      - name: eligibility_id
        description: Coverage span in effect on the fill date.
      - name: plan_id
        description: Plan of that coverage span.
      - name: has_linked_member
        description: True when the cardholder is linked to a member.
      - name: is_within_eligibility
        description: True when the linked member had coverage on the fill date. Null when not linked.

  - name: dim_member
    description: Deduplicated members with their most recent coverage span and plan.
    columns:
      - name: member_id
        description: "{{ doc('member_id') }}"
        data_tests: [unique, not_null]
      - name: first_name
        description: First name.
      - name: last_name
        description: Last name.
      - name: birth_date
        description: Date of birth. Null when the legacy value cannot be parsed.
      - name: gender
        description: Standardized gender (male, female, unknown, invalid).
      - name: zip_code
        description: ZIP code.
      - name: state
        description: Two-letter state code.
      - name: updated_at
        description: "{{ doc('updated_at') }}"
      - name: had_duplicates
        description: True when the legacy member master had more than one row for this member.
      - name: current_plan_id
        description: Plan of the member's most recent coverage span.
      - name: current_line_of_business
        description: "{{ doc('line_of_business') }}"
      - name: coverage_start_date
        description: "{{ doc('coverage_start_date') }}"
      - name: coverage_end_date
        description: "{{ doc('coverage_end_date') }}"
      - name: is_currently_covered
        description: True when the most recent coverage span includes the reference date (var as_of_date).
        data_tests: [not_null]

  - name: dim_plan
    description: Health plans (gold).
    columns:
      - name: plan_id
        description: "{{ doc('plan_id') }}"
        data_tests: [unique, not_null]
      - name: plan_name
        description: Plan name.
      - name: line_of_business
        description: "{{ doc('line_of_business') }}"
      - name: effective_date
        description: Date the plan became available.
      - name: termination_date
        description: Date the plan was discontinued. Null when still active.

  - name: dim_provider
    description: Providers (gold).
    columns:
      - name: provider_id
        description: "{{ doc('provider_id') }}"
        data_tests: [unique, not_null]
      - name: npi
        description: National Provider Identifier.
      - name: npi_format_valid
        description: True when the NPI has exactly 10 digits.
      - name: npi_valid
        description: True when the NPI has 10 digits and a valid check digit (Luhn).
      - name: provider_name
        description: Provider or clinic name.
      - name: specialty
        description: Decoded specialty.
      - name: state
        description: Two-letter state code.
      - name: updated_at
        description: "{{ doc('updated_at') }}"

  - name: dq_issue_summary
    description: >
      Data-quality scorecard of known legacy issues detected by the pipeline.
      Compare with the injection rates in legacy_db/seed/generate_legacy_data.py.
    columns:
      - name: check_name
        description: Name of the data-quality check.
        data_tests: [unique, not_null]
      - name: issue_count
        description: Records that fail the check.
      - name: population
        description: Records the check was applied to.

  - name: load_reliability
    description: Load success rate, volume and duration per source, from bronze._load_log.
    columns:
      - name: source
        description: Loaded source, named <system>.<load type>.<table> (e.g. legacy.cdc.clm_hdr).
        data_tests: [unique, not_null]
      - name: runs
        description: Number of recorded load steps.
      - name: successful_runs
        description: Load steps with status success.
      - name: success_rate_pct
        description: Share of successful load steps, in percent.
      - name: total_rows
        description: Sum of rows written across load steps.
      - name: last_max_rows
        description: Largest row count of a single load step.
      - name: avg_seconds
        description: Average duration of a load step, in seconds.
      - name: last_load_at
        description: End time of the most recent load step.

  - name: cdc_latency
    description: >
      Source-to-lakehouse latency of CDC changes per legacy table
      (commit in Postgres to arrival in bronze), with change volume by operation.
    columns:
      - name: source_table
        description: Legacy table name.
        data_tests: [unique, not_null]
      - name: changes
        description: Captured changes (snapshot rows excluded).
      - name: inserts
        description: Captured inserts.
      - name: updates
        description: Captured updates.
      - name: deletes
        description: Captured deletes.
      - name: truncates
        description: Captured truncates.
      - name: p50_latency_seconds
        description: Median latency, in seconds.
      - name: p95_latency_seconds
        description: 95th percentile latency, in seconds.
      - name: max_latency_seconds
        description: Maximum latency, in seconds.
      - name: last_commit_at
        description: Commit time of the most recent captured change.
      - name: last_loaded_at
        description: Arrival time of the most recent captured change.

  - name: cdc_slot_lag
    description: >
      Lag of the CDC replication slot, from the observations the loader records before
      each sync: how much WAL Postgres retained for the slot and how much was pending,
      how long the loader went between syncs, and how often the slot was lost.
    columns:
      - name: slot_name
        description: Replication slot name.
        data_tests: [unique, not_null]
      - name: observations
        description: Observations recorded (one per sync, plus one per slot loss).
      - name: slot_losses
        description: Times the loader found the slot invalidated and took a new snapshot.
      - name: first_observed_at
        description: Time of the first observation.
      - name: last_observed_at
        description: Time of the most recent observation.
      - name: max_seconds_between_syncs
        description: Longest gap between two observations, in seconds.
      - name: p95_pending_mb
        description: 95th percentile of the WAL pending at the start of a sync, in MB (MiB).
      - name: max_pending_mb
        description: Largest WAL pending at the start of a sync, in MB (MiB).
      - name: max_retained_mb
        description: Largest WAL retained for the slot, in MB (MiB). The cap is 1,024 MB.
      - name: last_wal_status
        description: >
          Postgres wal_status in the most recent observation: reserved, extended,
          unreserved (beyond the cap, at risk) or lost.
        data_tests:
          - accepted_values:
              arguments:
                values: [reserved, extended, unreserved, lost]
      - name: last_retained_mb
        description: WAL retained for the slot in the most recent observation, in MB (MiB).

  - name: terminology_code_check
    description: >
      Codes from external code systems in the exported ExplanationOfBenefit resources, read
      through the `eob_codes` ViewDefinition and checked against the code system on the service
      date: ICD-10-CM against the CMS release of the fiscal year (billable codes only), NDC
      against the FDA NDC Directory (marketed on the service date), place of service against the
      CMS code set (seed). Covers every exported resource, not a sample. CPT and NUBC revenue
      codes are licensed and the NCPDP code system is distributed only as a stub, so their codes
      are unverified. The test `assert_terminology_codes_valid` fails on any invalid code.
    data_tests:
      - unique_combination:
          arguments:
            columns: [element, code_system, code, status, reason]
    columns:
      - name: element
        description: Where the code is in the resource (diagnosis, item.productOrService, item.revenue, item.location, supportingInfo.code).
        data_tests: [not_null]
      - name: code_system
        description: Code system URI.
        data_tests: [not_null]
      - name: code
        description: The code as the resource carries it.
        data_tests: [not_null]
      - name: status
        description: valid, invalid or unverified.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [valid, invalid, unverified]
      - name: reason
        description: Why the code got its status (for valid ICD-10-CM codes, the fiscal year that applied).
        data_tests: [not_null]
      - name: resources
        description: ExplanationOfBenefit resources carrying the code with this outcome.
      - name: occurrences
        description: Times the code appears with this outcome (a resource can carry it on several lines).
      - name: first_service_date
        description: Earliest service date with this outcome.
      - name: last_service_date
        description: Latest service date with this outcome.

  - name: fhir_view_parity
    description: >
      Rows found on only one side when a ViewDefinition output is compared with the table it
      should reproduce: the hand-written Synthea patient model, and round trips of the legacy
      data through FHIR (gold table -> FHIR resource -> ViewDefinition).
    columns:
      - name: comparison
        description: Name of the comparison.
        data_tests: [unique, not_null]
      - name: view_rows
        description: Rows produced by the ViewDefinition.
      - name: reference_rows
        description: Rows in the reference table.
      - name: only_in_view
        description: ViewDefinition rows with no identical reference row (EXCEPT ALL).
      - name: only_in_reference
        description: Reference rows with no identical ViewDefinition row (EXCEPT ALL).

  - name: quality_runs
    description: >
      The runs of the data quality history (scripts/quality_history.py): the CI
      runs of main, local runs, and the run collecting. Volume columns come from
      the run's metrics; a run whose metrics come from its CI reports only has
      the resources it published, not the lakehouse row counts.
    columns:
      - name: run_key
        description: ci-<GitHub run id> or local-<UTC time of the snapshot>.
        data_tests: [unique, not_null]
      - name: run_at
        description: When the run started (CI) or the snapshot was taken (local).
        data_tests: [not_null]
      - name: commit
        description: The commit the run tested (a pull request's run tests its merge into main).
      - name: short_commit
        description: The first seven characters of the commit.
      - name: branch
        description: Branch of the run.
      - name: scenario
        description: Data scenario (base = the generators' default volumes; the scale benchmark adds others).
        data_tests: [not_null]
      - name: source
        description: ci or local.
        data_tests:
          - accepted_values:
              arguments:
                values: [ci, local]
      - name: ci_run_id
        description: GitHub Actions run id (CI runs only).
      - name: ci_event
        description: Event that started the CI run (push, pull_request).
      - name: conclusion
        description: Conclusion of a finished CI run (success, failure); empty for the run collecting and local runs.
      - name: duration_seconds
        description: Duration of a finished CI run, from its start to its last update.
      - name: metrics_from
        description: snapshot (taken by the run, with the lakehouse metrics) or reports (rebuilt from the run's reports artifact).
        data_tests:
          - accepted_values:
              arguments:
                values: [snapshot, reports]
      - name: metrics
        description: Number of metrics of the run.
      - name: areas
        description: Number of metric areas of the run.
      - name: legacy_members
        description: Members in the legacy source (silver.stg_legacy__members).
      - name: legacy_claims
        description: Legacy claims (gold.fct_claims).
      - name: synthea_patients
        description: Synthea patients (silver.stg_fhir__patients).
      - name: pbm_claims
        description: PBM claims (gold.fct_pbm_claims).
      - name: fhir_resources_published
        description: Resources published to both FHIR servers.
      - name: run_number
        description: Position of the run in its series (source, branch, scenario), from 1.

  - name: quality_history
    description: >
      Every metric of every run in quality_runs, with the value of the same
      metric in the previous run of its series (source, branch, scenario). One
      row per run, area, metric and dimension.
    columns:
      - name: run_key
        description: The run (quality_runs).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('quality_runs')
                field: run_key
      - name: run_at
        description: When the run started or the snapshot was taken.
      - name: short_commit
        description: The run's commit, seven characters.
      - name: source
        description: ci or local.
      - name: branch
        description: Branch of the run.
      - name: scenario
        description: Data scenario.
      - name: metrics_from
        description: snapshot or reports.
      - name: area
        description: Metric area.
        data_tests:
          - accepted_values:
              arguments:
                values: [load, cdc, fhir, linkage, data_quality, tests, performance, volume]
      - name: metric
        description: Metric name, e.g. match_precision or validation_errors.
        data_tests: [not_null]
      - name: dimension
        description: What the metric is of (a source, table, method, implementation guide); empty for a total.
        data_tests: [not_null]
      - name: value
        description: The metric's value.
      - name: previous_run_key
        description: The previous run of the series; empty for its first run.
      - name: previous_value
        description: The metric's value in the previous run; empty if that run did not have it.
      - name: change
        description: value - previous_value.

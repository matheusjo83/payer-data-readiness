version: 2

sources:
  - name: ops
    description: Operational metadata written by the ingestion loaders.
    schema: bronze
    tables:
      - name: load_log
        identifier: _load_log
      - name: cdc_slot_status
        identifier: _cdc_slot_status
        description: >
          State of the CDC replication slot, recorded by the loader before each
          sync (action = sync) and when it finds the slot lost and takes a new
          snapshot (action = resnapshot). Append-only.
